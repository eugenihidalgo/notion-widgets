<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fruta Hasta Mañana 12:30</title>

  <style>
    :root {
      --c1: rgba(255, 203, 76, 0.42);
      --c2: rgba(91, 255, 174, 0.24);
      --accent: #ff9f2f;
      --glow: rgba(255, 170, 60, 0.52);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #0b0b0b;
      color: #1d1408;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .widget {
      width: 100%;
      max-width: 980px;
      min-height: 330px;
      position: relative;
      overflow: hidden;
      padding: 30px;
      border-radius: 34px;
      color: #1d1408;
      background:
        radial-gradient(circle at 4% 0%, var(--c1), transparent 34%),
        radial-gradient(circle at 100% 100%, var(--c2), transparent 38%),
        linear-gradient(135deg, #fff7d8 0%, #ffd98f 42%, #ffb357 100%);
      border: 1px solid rgba(255, 255, 255, 0.55);
      box-shadow:
        0 28px 90px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
      transition: background 1s ease;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      grid-template-areas:
        "header header"
        "title countdown"
        "subtitle countdown"
        "progress progress"
        "message fruits";
      gap: 0 28px;
    }

    .glow {
      position: absolute;
      border-radius: 999px;
      filter: blur(52px);
      pointer-events: none;
      opacity: 0.72;
    }

    .glow-1 {
      width: 230px;
      height: 230px;
      top: -90px;
      right: -70px;
      background: var(--glow);
      animation: floatOne 7s ease-in-out infinite alternate;
    }

    .glow-2 {
      width: 170px;
      height: 170px;
      left: -60px;
      bottom: -30px;
      background: var(--c2);
      animation: floatTwo 8s ease-in-out infinite alternate;
    }

    .header,
    h1,
    .subtitle,
    .countdown,
    .progress-card,
    .message,
    .fruits {
      position: relative;
      z-index: 2;
    }

    .header {
      grid-area: header;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
    }

    .badge,
    .phase {
      padding: 8px 13px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.48);
      border: 1px solid rgba(255, 255, 255, 0.45);
      color: rgba(40, 22, 0, 0.75);
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      backdrop-filter: blur(14px);
    }

    .badge {
      color: #5c3100;
    }

    .phase {
      color: rgba(40, 22, 0, 0.58);
    }

    h1 {
      grid-area: title;
      margin: 0;
      font-size: clamp(42px, 6vw, 72px);
      line-height: 0.88;
      letter-spacing: -0.075em;
      color: #1c1003;
    }

    .subtitle {
      grid-area: subtitle;
      margin: 16px 0 0;
      max-width: 430px;
      color: rgba(42, 23, 0, 0.68);
      font-size: 15px;
      line-height: 1.5;
    }

    .countdown {
      grid-area: countdown;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 11px;
      align-self: center;
    }

    .box {
      padding: 20px 10px 17px;
      border-radius: 25px;
      text-align: center;
      background: rgba(255, 255, 255, 0.48);
      border: 1px solid rgba(255, 255, 255, 0.42);
      box-shadow:
        0 14px 30px rgba(116, 64, 0, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(14px);
    }

    .box strong {
      display: block;
      font-size: clamp(34px, 5.5vw, 58px);
      line-height: 1;
      font-weight: 950;
      letter-spacing: -0.07em;
      color: #211306;
      text-shadow: 0 0 22px rgba(255, 255, 255, 0.8);
    }

    .box span {
      display: block;
      margin-top: 7px;
      color: rgba(40, 22, 0, 0.52);
      font-size: 10px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .progress-card {
      grid-area: progress;
      margin-top: 28px;
      padding: 18px 20px 20px;
      border-radius: 28px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.62), rgba(255, 255, 255, 0.32));
      border: 1px solid rgba(255, 255, 255, 0.55);
      box-shadow:
        0 18px 44px rgba(107, 55, 0, 0.16),
        0 0 34px rgba(255, 179, 72, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(16px);
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 14px;
    }

    .progress-label {
      display: block;
      margin-bottom: 1px;
      color: rgba(42, 23, 0, 0.56);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .progress-top strong {
      display: block;
      color: #1c1003;
      font-size: clamp(42px, 7vw, 74px);
      line-height: 0.9;
      font-weight: 950;
      letter-spacing: -0.075em;
    }

    .progress-mini {
      margin-bottom: 7px;
      padding: 8px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.42);
      color: #6b3900;
      font-size: 11px;
      font-weight: 850;
      white-space: nowrap;
    }

    .progress {
      height: 32px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(85, 42, 0, 0.12);
      box-shadow:
        inset 0 0 0 1px rgba(87, 45, 0, 0.12),
        inset 0 8px 18px rgba(70, 35, 0, 0.12);
    }

    .bar {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background:
        linear-gradient(90deg, #ff7a1a, var(--accent), #fff2a6 72%, #ffffff);
      box-shadow:
        0 0 22px rgba(255, 133, 31, 0.58),
        0 0 48px var(--glow);
      transition: width 0.6s ease;
    }

    .message {
      grid-area: message;
      align-self: center;
      min-height: auto;
      margin: 18px 0 0;
      color: rgba(42, 23, 0, 0.72);
      font-size: 16px;
      line-height: 1.45;
    }

    .fruits {
      grid-area: fruits;
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 16px;
    }

    .fruits span {
      display: grid;
      place-items: center;
      width: 39px;
      height: 39px;
      border-radius: 17px;
      background: rgba(255, 255, 255, 0.44);
      border: 1px solid rgba(255, 255, 255, 0.42);
      box-shadow: 0 10px 22px rgba(116, 64, 0, 0.12);
      font-size: 22px;
      animation: pulse 2.8s ease-in-out infinite;
    }

    .fruits span:nth-child(2) { animation-delay: 0.15s; }
    .fruits span:nth-child(3) { animation-delay: 0.3s; }
    .fruits span:nth-child(4) { animation-delay: 0.45s; }
    .fruits span:nth-child(5) { animation-delay: 0.6s; }
    .fruits span:nth-child(6) { animation-delay: 0.75s; }

    @keyframes floatOne {
      from {
        transform: translate(0, 0) scale(1);
      }

      to {
        transform: translate(-25px, 30px) scale(1.15);
      }
    }

    @keyframes floatTwo {
      from {
        transform: translate(0, 0) scale(1);
      }

      to {
        transform: translate(28px, -22px) scale(1.1);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: translateY(0);
        opacity: 0.86;
      }

      50% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    @media (max-width: 720px) {
      .widget {
        max-width: 540px;
        min-height: auto;
        grid-template-columns: 1fr;
        grid-template-areas:
          "header"
          "title"
          "subtitle"
          "countdown"
          "progress"
          "message"
          "fruits";
        padding: 24px 20px;
        border-radius: 28px;
      }

      .subtitle {
        margin-bottom: 24px;
      }

      .countdown {
        align-self: auto;
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
      }

      .progress-top {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .progress {
        height: 26px;
      }

      .fruits {
        justify-content: flex-start;
      }
    }
  </style>
</head>

<body>
  <div class="widget">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="header">
      <span class="badge">Reto de hoy</span>
      <span class="phase" id="phase">Modo fruta</span>
    </div>

    <h1>Hoy sólo fruta</h1>

    <p class="subtitle">
      Desde las 15:00 hasta mañana a las 12:30. Ligero, limpio y enfocado.
    </p>

    <div class="countdown">
      <div class="box">
        <strong id="hours">00</strong>
        <span>horas</span>
      </div>

      <div class="box">
        <strong id="minutes">00</strong>
        <span>min</span>
      </div>

      <div class="box">
        <strong id="seconds">00</strong>
        <span>seg</span>
      </div>
    </div>

    <div class="progress-card">
      <div class="progress-top">
        <div>
          <span class="progress-label">Progreso del reto</span>
          <strong id="percent">0%</strong>
        </div>
        <span class="progress-mini">hasta mañana 12:30</span>
      </div>

      <div class="progress">
        <div class="bar" id="bar"></div>
      </div>
    </div>

    <p class="message" id="message">
      Hoy eliges fruta, agua y claridad.
    </p>

    <div class="fruits">
      <span>🍓</span>
      <span>🍊</span>
      <span>🍍</span>
      <span>🥝</span>
      <span>🍇</span>
      <span>🍉</span>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const hoursEl = document.getElementById("hours");
      const minutesEl = document.getElementById("minutes");
      const secondsEl = document.getElementById("seconds");
      const barEl = document.getElementById("bar");
      const percentEl = document.getElementById("percent");
      const messageEl = document.getElementById("message");
      const phaseEl = document.getElementById("phase");

      const phases = [
        {
          hour: 0,
          phase: "Madrugada",
          c1: "rgba(76, 85, 255, 0.24)",
          c2: "rgba(0, 190, 255, 0.13)",
          accent: "#8da2ff",
          glow: "rgba(120, 135, 255, 0.5)",
          message: "Empieza limpio. Hoy eliges fruta, agua y calma."
        },
        {
          hour: 2,
          phase: "Noche profunda",
          c1: "rgba(118, 80, 255, 0.24)",
          c2: "rgba(255, 95, 160, 0.13)",
          accent: "#b493ff",
          glow: "rgba(180, 147, 255, 0.48)",
          message: "No necesitas negociar. Sólo seguir tu decisión."
        },
        {
          hour: 4,
          phase: "Antes del sol",
          c1: "rgba(255, 132, 79, 0.25)",
          c2: "rgba(255, 208, 90, 0.14)",
          accent: "#ffb35c",
          glow: "rgba(255, 166, 92, 0.5)",
          message: "Nuevo día cerca. Manténlo simple."
        },
        {
          hour: 6,
          phase: "Amanecer",
          c1: "rgba(255, 212, 92, 0.28)",
          c2: "rgba(102, 255, 177, 0.16)",
          accent: "#ffd86b",
          glow: "rgba(255, 216, 107, 0.52)",
          message: "Fruta, foco y claridad. Vas muy bien."
        },
        {
          hour: 8,
          phase: "Mañana verde",
          c1: "rgba(82, 255, 158, 0.26)",
          c2: "rgba(43, 198, 111, 0.15)",
          accent: "#63f5a1",
          glow: "rgba(99, 245, 161, 0.48)",
          message: "Cada hora cuenta. Tu disciplina se fortalece."
        },
        {
          hour: 10,
          phase: "Media mañana",
          c1: "rgba(169, 255, 93, 0.24)",
          c2: "rgba(255, 221, 78, 0.15)",
          accent: "#caff6b",
          glow: "rgba(202, 255, 107, 0.45)",
          message: "Sigue ligero. No rompas el pacto."
        },
        {
          hour: 12,
          phase: "Mediodía",
          c1: "rgba(255, 173, 51, 0.3)",
          c2: "rgba(255, 88, 88, 0.15)",
          accent: "#ffa640",
          glow: "rgba(255, 166, 64, 0.55)",
          message: "Mediodía cerca. Mantén la dirección."
        },
        {
          hour: 14,
          phase: "Inicio cercano",
          c1: "rgba(255, 204, 79, 0.28)",
          c2: "rgba(255, 126, 54, 0.17)",
          accent: "#ffcf5f",
          glow: "rgba(255, 207, 95, 0.52)",
          message: "Prepárate. A las 15:00 empieza el pacto."
        },
        {
          hour: 16,
          phase: "Tropical",
          c1: "rgba(255, 79, 133, 0.25)",
          c2: "rgba(255, 214, 86, 0.16)",
          accent: "#ff6f9f",
          glow: "rgba(255, 111, 159, 0.48)",
          message: "Cuando aparezca el impulso, vuelve al pacto."
        },
        {
          hour: 18,
          phase: "Atardecer",
          c1: "rgba(255, 116, 64, 0.28)",
          c2: "rgba(154, 86, 255, 0.16)",
          accent: "#ff7d5c",
          glow: "rgba(255, 125, 92, 0.52)",
          message: "Ya has avanzado mucho. No rompas la cadena."
        },
        {
          hour: 20,
          phase: "Noche",
          c1: "rgba(107, 79, 255, 0.26)",
          c2: "rgba(34, 184, 255, 0.13)",
          accent: "#9d7cff",
          glow: "rgba(157, 124, 255, 0.48)",
          message: "Último tramo de la noche. Respira y sigue."
        },
        {
          hour: 22,
          phase: "Cierre",
          c1: "rgba(52, 70, 180, 0.24)",
          c2: "rgba(119, 255, 213, 0.12)",
          accent: "#87f7d4",
          glow: "rgba(135, 247, 212, 0.42)",
          message: "Quédate contigo. Mañana lo agradecerás."
        }
      ];

      function pad(value) {
        return String(value).padStart(2, "0");
      }

      function getCurrentPhase(hour) {
        let current = phases[0];

        for (let i = 0; i < phases.length; i++) {
          if (hour >= phases[i].hour) {
            current = phases[i];
          }
        }

        return current;
      }

      function updateTheme(now) {
        const theme = getCurrentPhase(now.getHours());

        document.documentElement.style.setProperty("--c1", theme.c1);
        document.documentElement.style.setProperty("--c2", theme.c2);
        document.documentElement.style.setProperty("--accent", theme.accent);
        document.documentElement.style.setProperty("--glow", theme.glow);

        phaseEl.textContent = theme.phase;
        messageEl.textContent = theme.message;
      }

      function getChallengeWindow(now) {
        const todayStart = new Date(now);
        todayStart.setHours(15, 0, 0, 0);

        const todayEnd = new Date(now);
        todayEnd.setHours(12, 30, 0, 0);

        let start;
        let end;

        if (now >= todayStart) {
          start = todayStart;
          end = new Date(now);
          end.setDate(end.getDate() + 1);
          end.setHours(12, 30, 0, 0);
        } else if (now <= todayEnd) {
          start = new Date(now);
          start.setDate(start.getDate() - 1);
          start.setHours(15, 0, 0, 0);

          end = todayEnd;
        } else {
          start = todayStart;
          end = new Date(now);
          end.setDate(end.getDate() + 1);
          end.setHours(12, 30, 0, 0);
        }

        return { start, end };
      }

      function updateCountdown() {
        const now = new Date();
        const challenge = getChallengeWindow(now);

        const difference = challenge.end.getTime() - now.getTime();
        const totalSeconds = Math.max(0, Math.floor(difference / 1000));

        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        hoursEl.textContent = pad(hours);
        minutesEl.textContent = pad(minutes);
        secondsEl.textContent = pad(seconds);

        const totalChallengeTime = challenge.end.getTime() - challenge.start.getTime();
        const elapsedTime = now.getTime() - challenge.start.getTime();

        let progress = (elapsedTime / totalChallengeTime) * 100;
        progress = Math.max(0, Math.min(100, progress));

        barEl.style.width = progress + "%";
        percentEl.textContent = Math.floor(progress) + "%";

        updateTheme(now);
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
    });
  </script>
</body>
</html>
